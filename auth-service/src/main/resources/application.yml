spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

security:
  session:
    ttl: ${SESSION_TTL:30d}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8082}
    audience: ${JWT_AUDIENCE:musical-greetings-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    key-id: ${JWT_KEY_ID:auth-2026-01}
    secret: ${JWT_SECRET}

server:
  port: ${SERVER_PORT:8082}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
